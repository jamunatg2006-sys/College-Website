<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invigilation System - Login</title>
<link rel="icon" type="image/png" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    :root {
        --bg-light: #F1F7F9;
        --accent-blue: #749DCB;
        --primary-blue: #0A6BC9;
        --dark-blue: #064089;
        --deep-blue: #07326A;
        --white: #FFFFFF;
        --light-gray: #f8fafc;
        --border-color: #e2e8f0;
        --text-dark: #334155;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Poppins', sans-serif;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: var(--bg-light);
        padding: 20px;
        position: relative;
    }
    

    /* Subtle background animation */
    body::before {
        content: '';
        position: absolute;
        width: 200px;
        height: 200px;
        border-radius: 50%;
        background: linear-gradient(45deg, var(--accent-blue), var(--primary-blue));
        opacity: 0.05;
        top: 10%;
        right: 10%;
        animation: float 6s ease-in-out infinite;
    }

    body::after {
        content: '';
        position: absolute;
        width: 150px;
        height: 150px;
        border-radius: 50%;
        background: linear-gradient(45deg, var(--dark-blue), var(--deep-blue));
        opacity: 0.05;
        bottom: 10%;
        left: 10%;
        animation: float 8s ease-in-out infinite reverse;
    }

    @keyframes float {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(-20px, 20px); }
    }

    /* Main container */
   .login-container {
    background: rgba(206, 226, 247, 0.894);
    padding: 12px 12px;       /* tighter padding */
    border-radius: 10px;
    box-shadow: 0 6px 14px rgba(7, 50, 106, 0.06);
    width: 100%;
    max-width: 420px;         /* compact container */
    height: auto;             /* adjust automatically */
    animation: slideUp 0.35s ease-out;
    position: relative;
    z-index: 1;
    border: 1px solid rgba(245, 248, 250, 0.9);

    display: flex;
    flex-direction: column;
    justify-content: center;  /* vertically center content */
    margin: 2.5vh auto;       /* center container on screen */
    font-size: 14px;
    line-height: 1.2;
}


    @keyframes slideUp {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    /* Header - Compact */
    .header {
        text-align: center;
        margin-bottom: 30px;
    }

    .header h1 {
        color: var(--deep-blue);
        font-size: 1.3em;
        font-weight: 700;
        margin-bottom: 6px;
    }

    .header p {
        color: var(--accent-blue);
        font-size: 0.95em;
        font-weight: 400;
    }

    /* Role Selection - Compact */
    .role-section {
        margin-bottom: 25px;
    }

    .role-toggle {
        display: flex;
        background: var(--light-gray);
        border-radius: 12px;
        padding: 3px;
        position: relative;
        border: 1px solid var(--border-color);
    }

    .toggle-slider {
        position: absolute;
        width: calc(33.333% - 8px);
        height: calc(100% - 6px);
        background: var(--white);
        border-radius: 10px;
        top: 4px;
        left: 4px;
        transition: transform 0.3s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        box-shadow: 0 2px 8px rgba(10, 107, 201, 0.15);
        z-index: 1;
    }

    .role-option {
        flex: 1;
        background: transparent;
        border: none;
        padding: 8px 6px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 500;
        color: var(--text-dark);
        position: relative;
        z-index: 2;
        transition: all 0.18s ease;
        font-size: 0.85em;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
    }

    .role-option i {
        font-size: 1.1em;
    }

    .role-option.active {
        color: var(--primary-blue);
        font-weight: 600;
    }

    /* ensure slider always fits inside and options don't wrap */
    .role-toggle { min-width: 260px; }

    /* Form sections */
    .form-section {
        margin-bottom: 20px;
        animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(5px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .form-section label {
        display: block;
        color: var(--deep-blue);
        font-weight: 600;
        margin-bottom: 8px;
        font-size: 0.9em;
    }

    /* Email Input */
    .email-input {
        width: 100%;
        padding: 12px 14px 12px 42px;
        border-radius: 10px;
        border: 1px solid var(--border-color);
        background: var(--white);
        color: var(--deep-blue);
        font-size: 0.95em;
        transition: all 0.2s ease;
        outline: none;
    }

    .email-input:focus {
        border-color: var(--primary-blue);
        box-shadow: 0 0 0 3px rgba(10, 107, 201, 0.1);
    }

    .email-container {
        position: relative;
    }

    .email-container i {
        position: absolute;
        left: 20px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--accent-blue);
        font-size: 1.1em;
        transition: all 0.3s ease;
    }

    .email-input:focus + i {
        color: var(--primary-blue);
    }
    /* Department Selection - Horizontal Slider */
.department-section {
    display: none;
    animation: slideDown 0.3s ease;
}

@keyframes slideDown {
    from { opacity: 0; max-height: 0; }
    to { opacity: 1; max-height: 120px; }
}

.departments-slider {
    display: flex;
    overflow-x: auto;
    scroll-behavior: smooth;
    gap: 8px;
    padding: 8px 0;
    scrollbar-width: thin;
}

.departments-slider::-webkit-scrollbar {
    height: 5px;
}

.departments-slider::-webkit-scrollbar-track {
    background: rgba(116, 157, 203, 0.08);
    border-radius: 10px;
}

.departments-slider::-webkit-scrollbar-thumb {
    background: linear-gradient(90deg, var(--accent-blue), var(--primary-blue));
    border-radius: 10px;
}

.dept-option {
    flex: 0 0 auto; /* do not shrink */
    padding: 8px 14px;
    background: var(--light-gray);
    color: var(--text-dark);
    border-radius: 16px;
    cursor: pointer;
    transition: all 0.2s ease;
    font-size: 0.78em;
    font-weight: 500;
    border: 2px solid transparent;
    white-space: nowrap;
    text-align: center;
}

.dept-option:hover {
    background: rgba(10, 107, 201, 0.1);
    transform: translateY(-2px);
}

.dept-option.selected {
    background: var(--primary-blue);
    color: var(--white);
    box-shadow: 0 4px 8px rgba(10, 107, 201, 0.2);
}


   

    
    /* Password Section */
    .password-section {
        position: relative;
    }

    .password-input {
        width: 100%;
        padding: 12px 14px 12px 42px;
        border-radius: 10px;
        border: 1px solid var(--border-color);
        background: var(--white);
        color: var(--deep-blue);
        font-size: 0.95em;
        transition: all 0.2s ease;
        outline: none;
    }

    .password-input:focus {
        border-color: var(--primary-blue);
        box-shadow: 0 0 0 3px rgba(10, 107, 201, 0.1);
    }

    .password-section i {
        position: absolute;
        left: 20px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--accent-blue);
        font-size: 1.1em;
    }

    .toggle-password {
        position: absolute;
        right: 15px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        color: var(--accent-blue);
        cursor: pointer;
        font-size: 1.1em;
        padding: 4px;
        border-radius: 50%;
        width: 32px;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .toggle-password:hover {
        background: rgba(10, 107, 201, 0.1);
    }

    .forgot-password {
        text-align: right;
        margin-top: 10px;
    }

    .forgot-password a {
        color: var(--accent-blue);
        text-decoration: none;
        font-size: 0.85em;
        transition: color 0.3s ease;
    }

    .forgot-password a:hover {
        color: var(--primary-blue);
        text-decoration: underline;
    }

    /* Login Button */
    .login-btn {
        width: 100%;
        background: linear-gradient(135deg, var(--primary-blue), var(--dark-blue));
        color: var(--white);
        border: none;
        padding: 10px 12px;
        border-radius: 10px;
        font-size: 0.95em;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
        margin-top: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        box-shadow: 0 6px 14px rgba(10, 107, 201, 0.12);
    }

    .login-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(10, 107, 201, 0.2);
    }

    .login-btn i {
        transition: transform 0.3s ease;
    }

    .login-btn:hover i {
        transform: translateX(3px);
    }

    /* Footer - Compact */
    .footer {
        text-align: center;
        margin-top: 25px;
        padding-top: 20px;
        border-top: 1px solid var(--border-color);
        color: var(--accent-blue);
        font-size: 0.8em;
    }

    /* Responsive */
    @media (max-width: 480px) {
        .login-container {
            padding: 30px 25px;
        }
        
        .header h1 {
            font-size: 1.8em;
        }
        
        .role-option {
            padding: 12px 6px;
            font-size: 0.85em;
            gap: 6px;
        }
        
        .dept-option {
            padding: 8px 14px;
            font-size: 0.8em;
        }
    }
</style>
</head>
<body>
    <!-- Main login container -->
    <div class="login-container">
        <!-- Header -->
        <div class="header">
            <h1>Invigilation System</h1>
            <p>Secure Login Portal</p>
        </div>

        <!-- Role Selection -->
        <div class="role-section">
            <div class="role-toggle">
                <div class="toggle-slider" id="toggleSlider"></div>
                <button type="button" class="role-option active" data-role="admin">
                    <i class="fas fa-user-shield"></i>
                    <span>Admin</span>
                </button>
                <button type="button" class="role-option" data-role="coordinator">
                    <i class="fas fa-users-cog"></i>
                    <span>Coordinator</span>
                </button>
                <button type="button" class="role-option" data-role="staff">
                    <i class="fas fa-user-tie"></i>
                    <span>Staff</span>
                </button>
            </div>
        </div>

        <!-- Login Form -->
        <form id="loginForm">
            <!-- Email Input -->
            <div class="form-section">
                <label for="email">Email Address</label>
                <div class="email-container">
                    <input type="email" id="email" class="email-input" placeholder="your.email@sirmvit.com" required>
                    <i class="fas fa-envelope"></i>
                </div>
            </div>

         <div class="form-section department-section" id="departmentSection">
    <label>Department</label>
    <div class="departments-slider">
        <div class="dept-option selected" data-dept="cse">CSE</div>
        <div class="dept-option" data-dept="ise">ISE</div>
         <div class="dept-option" data-dept="ai">AI-ML</div>
          <div class="dept-option" data-dept="ds">DS</div>
        <div class="dept-option" data-dept="ece">ECE</div>
        <div class="dept-option" data-dept="eee">EEE</div>
        <div class="dept-option" data-dept="mech">MECH</div>
        <div class="dept-option" data-dept="civil">CIVIL</div>
        <div class="dept-option" data-dept="mba">MBA</div>
        <div class="dept-option" data-dept="mca">MCA</div>
        <div class="dept-option" data-dept="bio">BT</div>
        <div class="dept-option" data-dept="chem">CHEM</div>
        <div class="dept-option" data-dept="phy">PHY</div>
        <div class="dept-option" data-dept="math">MATH</div>
    </div>
</div>


            <!-- Password Section -->
            <div class="form-section">
                <label for="password">Password</label>
                <div class="password-section">
                    <input type="password" id="password" class="password-input" placeholder="Enter your password" required>
                    <i class="fas fa-lock"></i>
                    <button type="button" class="toggle-password" id="togglePassword">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
                <div class="forgot-password">
                    <a href="#" id="forgotPassword">Forgot Password?</a>
                </div>
            </div>

            <!-- Login Button -->
            <button type="submit" class="login-btn">
                <span>Sign In</span>
                <i class="fas fa-arrow-right"></i>
            </button>

            <!-- Footer -->
            <div class="footer">
                <p>Invigilation System|By Bhanuprakash and Team</p>
            </div>
        </form>
    </div>

<script>
    // DOM Elements
    const roleOptions = document.querySelectorAll('.role-option');
    const toggleSlider = document.getElementById('toggleSlider');
    const departmentSection = document.getElementById('departmentSection');
    const togglePassword = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    const forgotPasswordLink = document.getElementById('forgotPassword');
    const deptOptions = document.querySelectorAll('.dept-option');
    const loginForm = document.getElementById('loginForm');

    // Initialize with Admin role active
    // position slider to active option and update departments
    function setInitialSlider() {
        const active = document.querySelector('.role-option.active');
        const idx = Array.from(roleOptions).indexOf(active);
        if (typeof idx === 'number' && !isNaN(idx)) {
            toggleSlider.style.transform = `translateX(${idx * 100}%)`;
        }
        updateDepartmentVisibility(active ? active.getAttribute('data-role') : 'admin');
    }
    setInitialSlider();

    // Role selection functionality
    roleOptions.forEach(option => {
        option.addEventListener('click', function() {
            // Remove active class from all options
            roleOptions.forEach(opt => opt.classList.remove('active'));
            
            // Add active class to clicked option
            this.classList.add('active');
            
            // Get selected role
            const selectedRole = this.getAttribute('data-role');
            
            // Update toggle slider position
            const index = Array.from(roleOptions).indexOf(this);
            toggleSlider.style.transform = `translateX(${index * 100}%)`;
            
            // Update department visibility
            updateDepartmentVisibility(selectedRole);
        });
    });

    // Update department visibility based on role
    function updateDepartmentVisibility(role) {
        if (role === 'admin' || role === 'coordinator') {
            departmentSection.style.display = 'block';
        } else {
            departmentSection.style.display = 'none';
        }
    }

    // Department selection
    deptOptions.forEach(option => {
        option.addEventListener('click', function() {
            // Remove selected class from all options
            deptOptions.forEach(opt => opt.classList.remove('selected'));
            
            // Add selected class to clicked option
            this.classList.add('selected');
        });
    });

    // Toggle password visibility
    togglePassword.addEventListener('click', function() {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        
        // Toggle icon
        const icon = this.querySelector('i');
        icon.className = type === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash';
    });

    // Forgot password functionality
    forgotPasswordLink.addEventListener('click', function(e) {
        e.preventDefault();
        alert('Password reset link will be sent to your registered email.');
    });

    // Form submission
    loginForm.addEventListener('submit', function(e) {
        e.preventDefault();
        
        const loginBtn = this.querySelector('.login-btn');
        const btnText = loginBtn.querySelector('span');
        const originalText = btnText.textContent;
        
        // Show loading state
        btnText.textContent = 'Signing In...';
        loginBtn.disabled = true;
        
        // Simulate authentication
        setTimeout(() => {
            // Reset button
            btnText.textContent = originalText;
            loginBtn.disabled = false;
            
            // Show success message
            const successMsg = document.createElement('div');
            successMsg.textContent = '✓ Login successful!';
            successMsg.style.cssText = `
                background: rgba(16, 185, 129, 0.1);
                color: #059669;
                padding: 12px;
                border-radius: 8px;
                margin-top: 15px;
                text-align: center;
                font-weight: 500;
                animation: fadeIn 0.3s ease;
                font-size: 0.9em;
            `;
            
            // Insert success message
            this.insertBefore(successMsg, this.querySelector('.footer'));
            
            // Remove message after delay
            setTimeout(() => {
                successMsg.remove();
            }, 3000);
        }, 1500);
    });

    // Add subtle hover effects
    const inputs = document.querySelectorAll('input');
    inputs.forEach(input => {
        input.addEventListener('focus', function() {
            this.parentElement.style.transform = 'translateY(-1px)';
        });
        
        input.addEventListener('blur', function() {
            this.parentElement.style.transform = 'translateY(0)';
        });
    });
</script>
</body>
</html>
